services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: favala_crm_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: postgres
      SHOP_DB_HOST: postgres
      APP_URL: http://localhost:8080
      # Container-network hostname for the standalone crm-test-service app
      # (see crm-test-service/) — 127.0.0.1 from .env would mean this
      # container's own loopback, not the host's, so it's overridden here
      # the same way DB_HOST/SHOP_DB_HOST are above.
      CRM_TEST_SERVICE_URL: http://crm-test-service:8090
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      crm-test-service:
        condition: service_started

  # Standalone crm-test-service application (see crm-test-service/) — a
  # genuinely separate app/process/database from `app` above, reached only
  # over HTTP via its container-network hostname (CRM_TEST_SERVICE_URL on
  # the app service).
  crm-test-service:
    build:
      context: ./crm-test-service
    container_name: favala_crm_test_service
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./crm-test-service:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: favala_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: favala_crm
      POSTGRES_USER: favala_crm
      POSTGRES_PASSWORD: favala_crm_secret
    ports:
      - "5432:5432"
    volumes:
      - favala_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U favala_crm -d favala_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: favala_crm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@favala.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  favala_crm_pgdata:
